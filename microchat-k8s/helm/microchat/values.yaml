replicaCount: 2

frontend:
  replicaCount: 2
  image:
    repository: vanbasten01/k8s-microchat-fd
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

restApi:
  replicaCount: 2
  image:
    repository: vanbasten01/chat-rest-api
    tag: "1.0.2"
    pullPolicy: IfNotPresent
  service:
    port: 5000

websocket:
  replicaCount: 2
  image:
    repository: vanbasten01/chat-websocket
    tag: "1.0.2"
    pullPolicy: IfNotPresent
  service:
    port: 8000

redis:
  image: redis:7-alpine
  port: 6379
  auth:
    enabled: true
    existingSecret: microchat-redis-secret
    passwordKey: password

mongodb:
  image: mongo:7
  port: 27017
  auth:
    enabled: true
    existingSecret: microchat-mongodb-secret
    usernameKey: username
    passwordKey: password
  persistence:
    enabled: true
    size: 5Gi

apiGateway:
  enabled: true
  service:
    type: LoadBalancer
    port: 80
