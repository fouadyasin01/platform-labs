{{- if .Values.autoscaling.restApi.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-rest-api
  labels:
    app.kubernetes.io/name: microchat
    app.kubernetes.io/component: rest-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-rest-api
  minReplicas: {{ .Values.autoscaling.restApi.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.restApi.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.restApi.targetCPUUtilizationPercentage }}
{{- end }}