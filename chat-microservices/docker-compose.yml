services:
  mongodb:
    image: mongo:8
    container_name: chat-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis:
    image: redis:8-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  rest-api:
    build:
      context: .
      dockerfile: rest-api/Dockerfile
    container_name: chat-rest-api
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${REST_API_PORT:-3001}:3001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  websocket:
    build:
      context: .
      dockerfile: websocket/Dockerfile
    container_name: chat-websocket
    restart: unless-stopped
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${WEBSOCKET_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: chat-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      rest-api:
        condition: service_healthy
      websocket:
        condition: service_healthy
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

volumes:
  mongodb-data:

networks:
  chat-network:
    driver: bridge