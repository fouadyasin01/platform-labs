services:
  rest-api:
    ports:
      - "3001:3001"
    volumes:
      - ./rest-api/src:/app/src
    command: flask --app src.app run --host=0.0.0.0 --port=3001 --debug
    environment:
      FLASK_DEBUG: "1"

  websocket:
    ports:
      - "3002:3002"
    volumes:
      - ./websocket/src:/app/src
    command: uvicorn src.main:app --host=0.0.0.0 --port=3002 --reload

  api-gateway:
    ports:
      - "8080:8080"