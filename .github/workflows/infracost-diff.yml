name: Infracost Diff

on:
  pull_request:
    branches:
      - project/cloudtasks
      - project/cloudtasks-staging
      - project/cloudtasks-prod
    paths:
      - "cloudtasks/terraform/**"
      - "cloudtasks/infracost.yml"
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Select PR environment
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event.pull_request.base.ref }}" in
            project/cloudtasks)
              ENV_NAME="dev"
              ;;
            project/cloudtasks-staging)
              ENV_NAME="staging"
              ;;
            project/cloudtasks-prod)
              ENV_NAME="prod"
              ;;
            *)
              echo "::error::Unsupported target branch"
              exit 1
              ;;
          esac

          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_ENV"

      - name: Configure Infracost for PR environment
        working-directory: head/cloudtasks
        shell: bash
        run: |
          set -euo pipefail

          cat > infracost.yml <<EOF
          version: 0.1

          projects:
            - path: terraform
              name: cloudtasks-${ENV_NAME}
              terraform_var_files:
                - terraform/environments/${ENV_NAME}.tfvars
          EOF

          echo "Infracost environment: ${ENV_NAME}"
          cat infracost.yml

      - name: Run Infracost Diff
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head