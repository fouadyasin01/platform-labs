name: Infracost Scan

on:
  push:
    branches:
      - project/cloudtasks
      - project/cloudtasks-staging
      - project/cloudtasks-prod
    paths:
      - "cloudtasks/terraform/**"
      - "cloudtasks/infracost.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  infracost-scan:
    runs-on: ubuntu-latest
    container: ghcr.io/infracost/ci:0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Infracost Scan
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost-ci scan --path cloudtasks
