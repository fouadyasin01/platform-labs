apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rest-api
  labels:
    app.kubernetes.io/name: microchat
    app.kubernetes.io/component: rest-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: microchat
    app.kubernetes.io/component: rest-api
  ports:
    - name: http
      port: {{ .Values.restApi.service.port }}
      targetPort: http
      protocol: TCP
