{{- if not .Values.mongodb.auth.existingSecretOnly }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongodb.auth.existingSecret }}
type: Opaque
stringData:
  username: {{ required "mongodb.auth.username must be set unless existingSecretOnly is true" .Values.mongodb.auth.username | quote }}
  password: {{ required "mongodb.auth.password must be set unless existingSecretOnly is true" .Values.mongodb.auth.password | quote }}
{{- end }}
