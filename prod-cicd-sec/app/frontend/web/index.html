<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MicroChat — real-time messaging" />
    <title>MicroChat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }

      h1 {
        margin-bottom: 5px;
      }

      #status {
        margin-bottom: 20px;
        font-size: 14px;
      }

      #messages {
        border: 1px solid #ddd;
        border-radius: 8px;
        min-height: 300px;
        padding: 15px;
        margin-bottom: 15px;
        overflow-wrap: anywhere;
      }

      .message {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }

      form {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 10px;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #333;
        outline-offset: 2px;
      }

      @media (max-width: 480px) {
        body {
          margin: 20px auto;
        }

        form {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Fouad's MicroChat — CI/CD Release v2.0</h1>
    <div id="status" role="status" aria-live="polite">Connecting...</div>

    <div
      id="messages"
      role="log"
      aria-label="Chat messages"
      aria-live="polite"
      aria-relevant="additions"
    ></div>

    <form id="message-form">
      <label for="message-input" hidden>Type a message</label>
      <input
        id="message-input"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
        aria-label="Type a message"
        required
      />
      <button type="submit">Send</button>
    </form>

    <script type="module">
      import { initializeChatApp } from "./app.js";

      initializeChatApp({ document });
    </script>
  </body>
</html>
