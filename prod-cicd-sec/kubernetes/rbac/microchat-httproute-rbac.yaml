apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microchat-httproute-deployer
  namespace: microchat-staging
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microchat-httproute-deployer
  namespace: microchat-staging
subjects:
  - kind: Group
    name: microchat-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: microchat-httproute-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microchat-httproute-deployer
  namespace: microchat-prod
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microchat-httproute-deployer
  namespace: microchat-prod
subjects:
  - kind: Group
    name: microchat-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: microchat-httproute-deployer
  apiGroup: rbac.authorization.k8s.io
