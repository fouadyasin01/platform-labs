apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.15.1
    helm:
      releaseName: karpenter
      values: |
        settings:
          clusterName: capston-2-dev
          clusterEndpoint: https://82D2280940EF0CAFD7082BE2B4A0FCE4.gr7.us-east-1.eks.amazonaws.com
          interruptionQueue: capston-2-dev

        serviceAccount:
          create: true
          name: karpenter
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::116248807984:role/capston-2-dev-karpenter-controller-role

        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
