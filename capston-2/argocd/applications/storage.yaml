apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/fouadyasin01/platform-labs.git
    targetRevision: feature/capston-2
    path: capston-2/kubernetes/storage
    kustomize: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true