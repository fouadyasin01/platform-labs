apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 21.2.3
      helm:
        releaseName: loki
        valueFiles:
          - $values/capston-2/monitoring/loki/values.yaml

    - repoURL: https://github.com/fouadyasin01/platform-labs.git
      targetRevision: feature/capston-2
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
