
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/capston-2/monitoring/prometheus/values.yaml

    - repoURL: https://github.com/fouadyasin01/platform-labs.git
      targetRevision: feature/capston-2
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
