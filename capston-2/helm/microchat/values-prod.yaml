frontend:
  replicaCount: 3

restApi:
  replicaCount: 3

websocket:
  replicaCount: 3

mongodb:
  persistence:
    size: 20Gi
    createStorageClass: false
  auth:
    existingSecretOnly: true

redis:
  auth:
    existingSecretOnly: true

autoscaling:
  frontend:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  restApi:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  websocket:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

gateway:
  enabled: true
  name: microchat-prod
  className: eg
  listener:
    name: http
    port: 80
    protocol: HTTP
  httpRoute:
    enabled: true

frontend:
  image:
    repository: vanbasten01/k8s-microchat-fd
    tag: "1.0.1"

restApi:
  image:
    repository: vanbasten01/chat-rest-api
    tag: "1.0.2"

websocket:
  image:
    repository: vanbasten01/chat-websocket
    tag: "1.0.3"
