apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-websocket
  labels:
    app.kubernetes.io/name: microchat
    app.kubernetes.io/component: websocket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: microchat
    app.kubernetes.io/component: websocket
  ports:
    - name: http
      port: {{ .Values.websocket.service.port }}
      targetPort: http
      protocol: TCP
