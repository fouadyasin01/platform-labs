frontend:
  replicaCount: 2

restApi:
  replicaCount: 2

websocket:
  replicaCount: 2

mongodb:
  persistence:
    size: 10Gi
    createStorageClass: false
  auth:
    existingSecretOnly: true

redis:
  auth:
    existingSecretOnly: true

autoscaling:
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  restApi:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  websocket:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

gateway:
  enabled: true
  name: microchat-staging
  className: eg
  listener:
    name: http
    port: 80
    protocol: HTTP
  httpRoute:
    enabled: true

frontend:
  image:
    repository: vanbasten01/k8s-microchat-fd
    tag: "ci-614b0488"

restApi:
  image:
    repository: vanbasten01/chat-rest-api
    tag: "ci-614b0488"

websocket:
  image:
    repository: vanbasten01/chat-websocket
    tag: "ci-614b0488"
