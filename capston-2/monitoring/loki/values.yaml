
deploymentMode: Monolithic

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::116248807984:role/capston-2-dev-loki-s3-role"

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: capston-2-dev-loki-chunks-116248807984
      ruler: capston-2-dev-loki-ruler-116248807984
    s3:
      region: us-east-1


chunksCache:
  enabled: true
  replicas: 1
  allocatedMemory: 265
  allocatedCPU: 100m

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

gateway:
  enabled: false
