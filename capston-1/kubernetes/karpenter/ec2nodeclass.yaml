
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: capston-1-dev-karpenter-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: capston-1-dev

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: capston-1-dev

  amiSelectorTerms:
    - alias: al2023@latest

  tags:
    Project: capston-1
    Environment: dev
    ManagedBy: Karpenter

