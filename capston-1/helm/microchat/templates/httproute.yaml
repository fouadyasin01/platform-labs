{{- if and .Values.gateway.enabled .Values.gateway.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-routes
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    # WebSocket traffic
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ .Release.Name }}-websocket
          port: 8000

    # REST API traffic
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Release.Name }}-rest-api
          port: 5000

    # Frontend: all remaining paths
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
