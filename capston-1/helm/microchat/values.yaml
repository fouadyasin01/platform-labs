replicaCount: 2

frontend:
  replicaCount: 2
  image:
    repository: vanbasten01/k8s-microchat-fd
    tag: "1.0.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

restApi:
  containerPort: 3001
  replicaCount: 2
  image:
    repository: vanbasten01/chat-rest-api
    tag: "1.0.2"
    pullPolicy: IfNotPresent
  service:
    port: 5000

websocket:
  replicaCount: 2
  containerPort: 3002
  image:
    repository: vanbasten01/chat-websocket
    tag: "1.0.3"
    pullPolicy: IfNotPresent
  service:
    port: 8000

redis:
  image: redis:7-alpine
  port: 6379
  auth:
    enabled: true
    existingSecret: microchat-redis-secret
    passwordKey: password

mongodb:
  image: mongo:7
  port: 27017
  auth:
    enabled: true
    existingSecret: microchat-mongodb-secret
    usernameKey: username
    passwordKey: password
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path
    createStorageClass: true
gateway:
  enabled: true
  name: microchat
  className: eg
  listener:
    name: http
    port: 80
    protocol: HTTP
  httpRoute:
    enabled: true
    path: /

autoscaling:
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  restApi:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  websocket:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
